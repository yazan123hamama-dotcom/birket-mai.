<!DOCTYPE html>
<html lang="ar">
<head>

<style>
:root{--fg:#2b1d10;box-sizing:border-box;color-scheme:only light}
canvas{filter:none!important;-webkit-filter:none!important}
html,body{height:100%;margin:0;background:#e9e4c4;overflow:hidden}

canvas{display:block;touch-action:none}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:14px system-ui,sans-serif;color:var(--fg);pointer-events:none}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.6);touch-action:none;user-select:none}
#stick{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#jump{position:fixed;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7);font:600 16px system-ui,sans-serif;color:#0b3550;touch-action:none;user-select:none}
#danger{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(150,0,0,.95) 100%);z-index:3}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;z-index:4}
#over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(110,0,0,.5);color:#fff;font:800 34px system-ui,sans-serif;z-index:5;text-align:center}
#again{font:700 20px system-ui,sans-serif;padding:12px 34px;border-radius:14px;border:0;background:#fff;color:#7a0000}
#throw{position:fixed;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:rgba(120,110,95,.6);border:2px solid rgba(255,255,255,.7);font:600 15px system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;display:none}
#duck,#bomb{position:fixed;right:calc(126px + env(safe-area-inset-right,0px));width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.7);font:600 20px system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;display:none}
#duck{bottom:calc(48px + env(safe-area-inset-bottom,0px));background:rgba(210,160,20,.75)}
#bomb{bottom:calc(124px + env(safe-area-inset-bottom,0px));background:rgba(50,50,50,.8)}
#coins{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));font:700 18px system-ui,sans-serif;color:#2b1d10;background:rgba(255,255,255,.5);padding:4px 12px;border-radius:12px;pointer-events:none;z-index:2}
#toast{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:700 18px system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .3s;z-index:6}
.shopItem{background:#f2e3b8;color:#2b1d10;display:flex;flex-direction:column;gap:3px;padding:10px 8px!important;font-size:20px!important;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.shopItem small{font:400 14px system-ui,sans-serif;opacity:.85}
.shopItem.shake{animation:shk .4s}
#shopOver{font:700 18px system-ui,sans-serif;padding:10px 30px;border-radius:14px;border:0;background:#f2e3b8;color:#2b1d10}
#shop{gap:10px}
body.menu #hint,body.menu #joy,body.menu #jump,body.menu #throw,body.menu #duck,body.menu #bomb,body.menu #coins{display:none!important}
#menu,#shop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:7;font-family:system-ui,sans-serif;text-align:center;padding:0 16px}
#menu{background:radial-gradient(ellipse at center,rgba(43,29,16,.25),rgba(43,29,16,.75))}
#shop{display:none;z-index:8;background:rgba(43,29,16,.88);color:#fff}
#menu h1{margin:0 0 18px;font:800 44px system-ui,sans-serif;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.mbtn{width:min(280px,80vw);padding:16px 0;border:0;border-radius:16px;font:700 22px system-ui,sans-serif;touch-action:manipulation}
#play{background:#3fbf7a;color:#0b2a1a;font-size:28px;padding:20px 0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#shopBtn{background:#f2e3b8;color:#2b1d10;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#lockBtn{background:rgba(255,255,255,.18);color:rgba(255,255,255,.7);border:2px dashed rgba(255,255,255,.5)}
#lockBtn.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#shop .t{font:800 30px system-ui,sans-serif}
#shop .s{font:18px system-ui,sans-serif;opacity:.85}
</style>
</head>

<script>
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const sky=new THREE.Color(0xe9e4c4);
const scene=new THREE.Scene();
scene.background=sky;
scene.fog=new THREE.FogExp2(sky,0.03);
const camera=new THREE.PerspectiveCamera(90,innerWidth/innerHeight,0.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setClearColor(sky,1);
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

function box(w,h,d,x,y,z,color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));

const tileTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#dcbc7c';g.fillRect(0,0,64,64);g.strokeStyle='#a98448';g.lineWidth=4;g.strokeRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,4);return t;})();
const stripeTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#dcbc7c';g.fillRect(0,0,64,64);g.fillStyle='#6b3f1e';g.fillRect(0,6,64,10);g.fillRect(0,26,64,10);g.fillRect(0,46,64,10);
  g.strokeStyle='#a98448';g.lineWidth=4;g.strokeRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,2);return t;})();

const HW=80; // half width of rooms and pools
// ---- room: x -HW..HW, z -16..8, floor top y=1 ----
box(HW*2,0.4,37,0,0.8,2.5,0xffffff).material.map=(()=>{const t=tileTex.clone();t.needsUpdate=true;t.repeat.set(HW,18);return t;})();

const bed=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,77),new THREE.MeshLambertMaterial({color:0xd9c690}));
bed.rotation.x=-Math.PI/2;bed.position.set(0,-4,59.5);scene.add(bed);

const restTex=tileTex.clone();restTex.needsUpdate=true;restTex.repeat.set(HW,20);
box(HW*2,5,40,0,-1.5,118,0xffffff).material.map=restTex;
box(0.5,40,122,-HW-0.25,16,169,0xd8c9a0);

// ---- rest area 2: z 188..208, then level 3 pool z 208..268 ----
box(HW*2,5,40,0,-1.5,238,0xffffff).material.map=restTex;
box(0.5,40,322,-HW-0.25,16,389,0xd8c9a0);
box(0.5,40,322,HW+0.25,16,389,0xd8c9a0);
box(HW*2+1,40,0.5,0,16,550.25,0xd8c9a0);
box(8,0.8,1.6,-12,1.4,228,0x7a4a28);
box(8,0.8,1.6,12,1.4,228,0x7a4a28);
const bed3=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,100),new THREE.MeshLambertMaterial({color:0xd9c690}));
bed3.rotation.x=-Math.PI/2;bed3.position.set(0,-4,308);scene.add(bed3);
// ---- rest area 3: z 368..388, then level 4 (memory) pool z 388..548 ----
box(HW*2,5,40,0,-1.5,378,0xffffff).material.map=restTex;
box(8,0.8,1.6,-12,1.4,368,0x7a4a28);
box(8,0.8,1.6,12,1.4,368,0x7a4a28);
const bed4=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,150),new THREE.MeshLambertMaterial({color:0xd9c690}));
bed4.rotation.x=-Math.PI/2;bed4.position.set(0,-4,473);scene.add(bed4);
// ---- tunnel gates: at the far end of every rest area, walk through the arch to reach the next level ----
const TW=[[111,125],[231,245],[371,385]],OPENW=4.5,TD=14;
const GATES=[[4,8],...TW]; // [4,8] = arch out of the start lobby
function tunnelWall(z0,dep,map){
  const TDEP=dep||TD;
  const W=HW+0.5,sh=new THREE.Shape();
  sh.moveTo(-W,-6);sh.lineTo(W,-6);sh.lineTo(W,30);sh.lineTo(-W,30);sh.lineTo(-W,-6);
  const h=new THREE.Path();
  h.moveTo(-OPENW,0.9);h.lineTo(OPENW,0.9);h.lineTo(OPENW,6);h.absarc(0,6,OPENW,0,Math.PI,false);h.lineTo(-OPENW,0.9);
  sh.holes.push(h);
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:TDEP,bevelEnabled:false}),new THREE.MeshLambertMaterial(map?{color:0xffffff,map}:{color:0xd8c9a0}));
  m.position.set(0,0,z0);scene.add(m);
}
for(const [a] of TW)tunnelWall(a);
// ---- writing on the tunnel walls + arrows on the floor ----
const wallTex=(()=>{const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  g.fillStyle='#2b1d10';g.textAlign='center';g.textBaseline='middle';g.font='bold 78px "Permanent Marker","Segoe Print","Comic Sans MS",cursive';
  g.save();g.translate(256,128);g.rotate(-0.06);g.fillText("DON'T SPLASH,",0,-48);g.fillText('IT KNOWS',20,48);g.restore();
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;})();
const arrowTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#2b1d10';g.fillRect(8,54,50,20);g.fillRect(78,54,50,20);
  g.beginPath();g.moveTo(150,22);g.lineTo(150,106);g.lineTo(246,64);g.closePath();g.fill();
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;})();
const txtMat=new THREE.MeshBasicMaterial({map:wallTex,transparent:true,depthWrite:false});
const arrMat=new THREE.MeshBasicMaterial({map:arrowTex,transparent:true,depthWrite:false});
for(const [a] of TW){
  for(const [sx,ry] of [[-1,Math.PI/2],[1,-Math.PI/2]]){
    const w=new THREE.Mesh(new THREE.PlaneGeometry(7,3.5),txtMat);
    w.position.set(sx*(OPENW-0.03),3.4,a+TD*0.45);w.rotation.y=ry;scene.add(w);
    const ar=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.3),arrMat);
    ar.position.set(sx*(OPENW-0.03),1.5,a+TD*0.45);ar.rotation.y=ry;ar.scale.set(0.9*(sx<0?-1:1),0.9,1);ar.position.y=1.3;scene.add(ar);
  }
  for(const dz of [3,TD-3.5]){
    const f=new THREE.Mesh(new THREE.PlaneGeometry(3.2,1.6),arrMat);
    f.rotation.x=-Math.PI/2;f.rotation.z=-Math.PI/2;f.position.set(0,1.02,a+dz);scene.add(f);
  }
}


// ---- start lobby: tiled room with shop stalls, glowing exit door and an arch out to the pool ----
const LW=26,lobbyCols=[];
const wallTile=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#f1e8c9';g.fillRect(0,0,64,64);g.strokeStyle='#cbbd92';g.lineWidth=3;g.strokeRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;})();
function tileBox(w,h,d,x,y,z,rx,ry){const m=box(w,h,d,x,y,z,0xffffff);const t=wallTile.clone();t.needsUpdate=true;t.repeat.set(rx,ry);m.material.map=t;return m;}
tileBox(HW*2+1,30,0.5,0,16,-16,80,15);            // back wall
tileBox(0.5,30,20,-LW,16,-6,10,15);                // left lobby wall
tileBox(0.5,30,20,LW,16,-6,10,15);                 // right lobby wall
{const t=wallTile.clone();t.needsUpdate=true;t.repeat.set(0.5,0.5);tunnelWall(4,4,t);}  // front wall with the arch to the pool
box(LW*2,0.5,20,0,14,-6,0xe8dcb8);                 // ceiling
{const lamp=new THREE.Mesh(new THREE.BoxGeometry(7,0.15,7),new THREE.MeshBasicMaterial({color:0xffffff}));lamp.position.set(0,13.7,-5);scene.add(lamp);}
function signMesh(text,bg,fg,w,h,x,y,z,ry){
  const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=8;g.strokeRect(4,4,c.width-8,c.height-8);
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  let fs=Math.round(c.height*0.62);g.font='800 '+fs+'px system-ui,Arial,sans-serif';
  while(g.measureText(text).width>c.width-40&&fs>10){fs-=4;g.font='800 '+fs+'px system-ui,Arial,sans-serif';}
  g.fillText(text,c.width/2,c.height/2+2);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));m.position.set(x,y,z);m.rotation.y=ry||0;scene.add(m);return m;}
function stripeCanvas(a,b){const c=document.createElement('canvas');c.width=128;c.height=16;const g=c.getContext('2d');
  for(let i=0;i<8;i++){g.fillStyle=i%2?b:a;g.fillRect(i*16,0,16,16);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function stall(x,label,ca,cb,sbg,sfg){
  const z=2.4;
  box(5.6,1.6,2.2,x,1.8,z,0x9a6b3e);
  box(5.6,4.4,0.3,x,3.2,3.7,0x6e4726);
  box(0.3,4.4,0.3,x-2.7,3.2,1.4,0x6e4726);box(0.3,4.4,0.3,x+2.7,3.2,1.4,0x6e4726);
  box(6,0.4,3,x,5.6,z-0.2,0xffffff).material.map=stripeCanvas(ca,cb);
  signMesh(label,sbg,sfg,5.4,1.3,x,6.9,3.5,Math.PI);
  box(0.8,0.5,0.8,x-1.5,2.85,z-0.2,0xc84b3a);box(0.8,0.5,0.8,x,2.85,z-0.2,0xe8b23a);box(0.8,0.5,0.8,x+1.5,2.85,z-0.2,0x4aa66a);
  for(const dx of [-1.8,0,1.8])lobbyCols.push([x+dx,z,1.4]);
}
stall(-20,'EQUIPMENT','#ffffff','#6b3fa0','#5b2f8f','#ffffff');
stall(-12,'UPGRADES','#ffffff','#f0b429','#f0b429','#3a2a05');
stall(17,'SHOP','#ffffff','#f0b429','#f0b429','#3a2a05');
box(2.4,1.5,1.4,9,1.75,3.0,0x7a5a3a);lobbyCols.push([9,3.0,1.3]);
signMesh('3RD PERSON','#1d2a4a','#ffffff',3.2,0.9,9,3.5,3.5,Math.PI);
function ring(x,z,r1,r2,color){const m=new THREE.Mesh(new THREE.RingGeometry(r1,r2,48),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(x,1.03,z);scene.add(m);return m;}
const SHOP_PAD={x:17,z:-0.6};let shopLock=false;
ring(SHOP_PAD.x,SHOP_PAD.z,1.5,1.9,0xffd84a);ring(9,0.4,1.0,1.3,0x5fe3ff);
box(5,0.05,0.5,-20,1.03,-0.2,0xffd84a);box(5,0.05,0.5,-12,1.03,-0.2,0xffd84a);
// glowing "back to lobby" door
{const c=document.createElement('canvas');c.width=128;c.height=256;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#bff3ff');g.fillStyle=gr;g.fillRect(0,0,128,256);
  const t=new THREE.CanvasTexture(c);
  box(4.8,8.1,0.1,0,5.05,-15.72,0x9a8a60);
  const door=new THREE.Mesh(new THREE.PlaneGeometry(4.2,7.5),new THREE.MeshBasicMaterial({map:t}));door.position.set(0,4.75,-15.6);scene.add(door);
  signMesh('BACK TO LOBBY','#f4f1e4','#2b2b2b',5.4,1.1,0,10.2,-15.65,0);}
// "DON'T SPLASH, IT KNOWS" on the right lobby wall
{const w=new THREE.Mesh(new THREE.PlaneGeometry(9,4.5),txtMat);w.position.set(LW-0.28,7,-6);w.rotation.y=-Math.PI/2;scene.add(w);}

box(8,0.8,1.6,-12,1.4,108,0x7a4a28);
box(8,0.8,1.6,12,1.4,108,0x7a4a28);
const bed2=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,80),new THREE.MeshLambertMaterial({color:0xd9c690}));
bed2.rotation.x=-Math.PI/2;bed2.position.set(0,-4,178);scene.add(bed2);
box(0.5,40,100,-HW-0.25,16,58,0xd8c9a0);
box(0.5,40,100,HW+0.25,16,58,0xd8c9a0);

const wg=new THREE.PlaneGeometry(HW*2,77,60,77);wg.rotateX(-Math.PI/2);wg.translate(0,0,59.5);
const water=new THREE.Mesh(wg,new THREE.MeshPhongMaterial({color:0x3fbf7a,transparent:false,opacity:1,shininess:30,specular:0x88aa88}));
scene.add(water);
const base=wg.attributes.position.array.slice();
const wg2=new THREE.PlaneGeometry(HW*2,80,50,53);wg2.rotateX(-Math.PI/2);wg2.translate(0,0,178);
scene.add(new THREE.Mesh(wg2,water.material));
const base2=wg2.attributes.position.array.slice();
const wg3=new THREE.PlaneGeometry(HW*2,100,50,66);wg3.rotateX(-Math.PI/2);wg3.translate(0,0,308);
scene.add(new THREE.Mesh(wg3,water.material));
const base3=wg3.attributes.position.array.slice();
const wg4=new THREE.PlaneGeometry(HW*2,150,50,100);wg4.rotateX(-Math.PI/2);wg4.translate(0,0,473);
scene.add(new THREE.Mesh(wg4,water.material));
const base4=wg4.attributes.position.array.slice();
function waveH(x,z,t){return Math.sin(x*0.3+t*1.2)*0.3+Math.cos(z*0.4+t*0.9)*0.22+Math.sin((x+z)*0.15+t*0.6)*0.3;}

// ---- branching routes: walkers hop forward / sideways, merging into a web of paths ----
function genPath(z0,z1,starts,stepZ,sideX,minD,ok){
  const pts=[];
  const near=(x,z)=>pts.find(q=>Math.hypot(q.x-x,q.z-z)<minD);
  for(const sx0 of starts){
    let x=sx0+(rnd()-0.5)*4,z=z0+rnd()*2;
    while(z<z1){
      const o=near(x,z);
      if(o){x=o.x;z=o.z;}else if(ok(x,z))pts.push({x,z});
      let dx,dz;
      if(rnd()<0.3){dz=1+rnd()*2;dx=(rnd()<0.5?-1:1)*(sideX*0.8+rnd()*sideX*0.3);}
      else{dz=stepZ[0]+rnd()*(stepZ[1]-stepZ[0]);dx=(rnd()-0.5)*2*sideX;}
      if(Math.abs(x+dx)>HW-6)dx=-dx;
      x+=dx;z=Math.min(z+dz,z1);
    }
    if(!near(x,z1)&&ok(x,z1))pts.push({x,z:z1});
  }
  return pts;
}

function quack(x,z){
  if(!AC)return;
  const n=AC.currentTime,vol=Math.min(0.7,10/Math.max(1,Math.hypot(x-px,z-pz))*0.35);
  for(const [d0,f] of [[0,540],[0.22,480]]){
    const o=AC.createOscillator(),g=AC.createGain(),bp=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(f,n+d0);o.frequency.exponentialRampToValueAtTime(f*0.7,n+d0+0.15);
    bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=2;
    g.gain.setValueAtTime(0.0001,n+d0);g.gain.exponentialRampToValueAtTime(vol,n+d0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+d0+0.17);
    o.connect(bp);bp.connect(g);g.connect(master);o.start(n+d0);o.stop(n+d0+0.2);
  }
}

function updateDucks(t,dt){
  for(let i=ducks.length-1;i>=0;i--){

      d.x+=d.vx*dt;d.z+=d.vz*dt;d.travel+=Math.hypot(d.vx,d.vz)*dt;

  mon.armL.rotation.x=-s*0.8*amp-0.2;mon.armR.rotation.x=s*0.8*amp-0.2;
  if(dead){mon.armL.rotation.x=-2.4;mon.armR.rotation.x=-2.4;}
  mon.body.position.y=2.6+Math.abs(s)*0.35*amp;
  M.rt+=dt;if(M.moving&&M.rt>0.09){M.rt=0;ripple(M.x,M.z);}
  M.fall+=((M.state==='stun'?1:0)-M.fall)*Math.min(1,dt*6);
  M.g.position.set(M.x,waveH(M.x,M.z,t)-0.3+M.fall*1.1,M.z);M.g.rotation.set(-1.45*M.fall,M.face,0);
  const dd=Math.hypot(px-M.x,pz-M.z);
  document.getElementById('danger').style.opacity=(!dead&&M.state==='hunt')?Math.max(0,1-dd/50)*0.7:0;
}

function loop(ms){
  const t=ms*0.001,dt=Math.min(0.05,t-last);last=t;
  const p=wg.attributes.position.array;
  for(let i=0;i<p.length;i+=3){p[i+1]=waveH(base[i],base[i+2],t);}
  wg.attributes.position.needsUpdate=true;wg.computeVertexNormals();
  const p2=wg2.attributes.position.array;
  for(let i=0;i<p2.length;i+=3){p2[i+1]=waveH(base2[i],base2[i+2],t);}
  wg2.attributes.position.needsUpdate=true;wg2.computeVertexNormals();
  const p3=wg3.attributes.position.array;
  for(let i=0;i<p3.length;i+=3){p3[i+1]=waveH(base3[i],base3[i+2],t);}
  wg3.attributes.position.needsUpdate=true;wg3.computeVertexNormals();
  const p4=wg4.attributes.position.array;
  for(let i=0;i<p4.length;i+=3){p4[i+1]=waveH(base4[i],base4[i+2],t);}
  wg4.attributes.position.needsUpdate=true;wg4.computeVertexNormals();
  for(const b of blocks){
    const ud=b.userData;
    if(ud.mv){const nx=ud.bx+Math.sin(t*ud.spd+ud.ph)*ud.amp,nz=ud.bz+Math.sin(t*ud.spz+ud.phz)*ud.amz;ud.dx=nx-ud.x;ud.dz=nz-ud.z;ud.x=nx;ud.z=nz;}
    if(ud.stone&&!ud.stone.visible&&ud.stoneT>0){ud.stoneT-=dt;if(ud.stoneT<=0)ud.stone.visible=true;}
    let shake=0;
    if(ud.sk){
      if(ud.ph===0){
        if(curBlock===ud&&onBlock)ud.stand+=dt;else ud.stand=Math.max(0,ud.stand-dt*0.5);
        if(ud.stand>=(ud.sThr||2)){ud.ph=1;ud.t=0;if(AC){burst(master,0.6,300,0.7,0.6,'lowpass');if(ud.sp)burst(master,0.25,1800,0.8,0.5);}}
        else if(ud.stand>(ud.sThr||2)*0.55)shake=Math.sin(t*50)*0.05;
      }else if(ud.ph===1){ud.off=Math.max(-3.2,ud.off-dt*(ud.sp||5));if(ud.off<=-3.2){ud.ph=2;ud.t=0;}}
      else if(ud.ph===2){ud.t+=dt;if(ud.t>5)ud.ph=3;}
      else{ud.off=Math.min(0,ud.off+dt*1.2);if(ud.off>=0){ud.ph=0;ud.stand=0;}}
      if(b.material.color)b.material.color.setHex((ud.ph===1||(ud.ph===0&&ud.stand>(ud.sThr||2)*0.55))?0xff8a70:0xffffff);
    }
    const {x,z,s}=b.userData;
    b.position.set(x,waveH(x,z,t)+s*0.05+(ud.yo||0)+(ud.off||0)+shake,z);
    b.rotation.z=-(waveH(x+1,z,t)-waveH(x-1,z,t))*0.5;
    b.rotation.x=(waveH(x,z+1,t)-waveH(x,z-1,t))*0.5;
  }
  if(!started){
    camera.position.set(0,3,0);
    camera.lookAt(Math.sin(t*0.2)*10,2.2,40);
    renderer.render(scene,camera);requestAnimationFrame(loop);return;
  }
  memT+=dt;matGlow.emissive.setHex((memT%10)<3?0xffc830:0x000000);
  let fx=mx,fz=mz;
  if(keys.w||keys.arrowup)fz+=1;if(keys.s||keys.arrowdown)fz-=1;
  if(keys.d||keys.arrowright)fx+=1;if(keys.a||keys.arrowleft)fx-=1;
  if(dead){fx=0;fz=0;}
  const len=Math.hypot(fx,fz);if(len>1){fx/=len;fz/=len;}
  const sy=Math.sin(yaw),cy=Math.cos(yaw),speed=inFloor(pz)?8.5:7.5;
  const opx=px,opz=pz;
  px+=(sy*fz-cy*fx)*speed*dt;pz+=(cy*fz+sy*fx)*speed*dt;
  if(curBlock&&curBlock.mv&&onBlock){px+=curBlock.dx;pz+=curBlock.dz;}
  px=Math.max(1-HW,Math.min(HW-1,px));pz=Math.max(-15,Math.min(546,pz));
  if(inFloor(pz)&&!inFloor(opz)&&fy<0.6)pz=opz;
  let g=inFloor(pz)?1:waveH(px,pz,t),surf=inFloor(pz)?'floor':'water',cb=null;
  for(const b of blocks){
    const {x,z,s}=b.userData,ry=b.rotation.y;
    const dx=px-x,dz=pz-z;
    const lx2=dx*Math.cos(ry)-dz*Math.sin(ry),lz2=dx*Math.sin(ry)+dz*Math.cos(ry);
    if(Math.abs(lx2)<s&&Math.abs(lz2)<s*0.7){
      const top=b.position.y+s*0.125;
      if(fy>=top-0.4){if(top>g){g=top;surf='block';cb=b.userData;}}
      else if(b.userData.mv){px=x+(px>=x?1:-1)*(s+0.05);pz=opz;}else{px=opx;pz=opz;}
    }
  }
  for(const [x,z,r] of pillars){if(Math.hypot(px-x,pz-z)<r+0.6){px=opx;pz=opz;}}
  for(const [a,b] of GATES){
    if(pz>a-0.4&&pz<b+0.4&&Math.abs(px)>OPENW-0.5){
      if(opz<=a-0.4||opz>=b+0.4)pz=opz;
      else px=Math.max(-(OPENW-0.5),Math.min(OPENW-0.5,px));
    }
  }
  if(pz<4.2)px=Math.max(-(LW-0.8),Math.min(LW-0.8,px));
  for(const [x,z,r] of lobbyCols){if(Math.hypot(px-x,pz-z)<r+0.6){px=opx;pz=opz;}}
  {const dsp=Math.hypot(px-SHOP_PAD.x,pz-SHOP_PAD.z);
   if(dsp<1.9&&!shopLock&&!dead){shopLock=true;document.getElementById('shop').style.display='flex';refreshShop();}else if(dsp>3.2)shopLock=false;}
  px=Math.max(1-HW,Math.min(HW-1,px));
  if(keys[' '])jump();
  fy+=vy*dt;vy-=32*dt;
  if(fy<=g+0.05&&vy<=0){fy=g;vy=0;grounded=true;}else grounded=false;
  py=fy+2;
  const nowWater=grounded&&surf==='water';
  onBlock=grounded&&surf==='block';inWater=nowWater;overWater=surf==='water';onFloor=surf==='floor';
  if(surf==='block')curBlock=cb;else if(grounded)curBlock=null;
  if(onBlock&&curBlock&&curBlock.stone&&curBlock.stone.visible&&held<3&&!dead){
    curBlock.stone.getWorldPosition(HP);
    if(Math.hypot(HP.x-px,HP.z-pz)<2.6){curBlock.stone.visible=false;curBlock.stoneT=30;held++;updHeld();if(AC)burst(master,0.12,2200,1,0.25);}
  }
  throwBtn.style.display=(held>0&&!dead)?'block':'none';
  duckBtn.style.display=(inv.duck>0&&!dead)?'block':'none';
  bombBtn.style.display=(inv.bomb>0&&!dead)?'block':'none';
  if(grounded)safeAir=false;
  canHit=grounded?nowWater:(overWater&&!safeAir);
  if(nowWater&&!prevWater){splash();ripple(px,pz);}
  if(nowWater)wake(px,pz);
  if(nowWater){if(fx||fz){stepT+=dt;if(stepT>0.38){stepT=0;waterStep();ripple(px,pz);}}}
  prevWater=nowWater;
  if(!dead){
    if(level===4&&onBlock&&curBlock&&curBlock.last&&doneLevels<4){doneLevels=4;addCoins(100,'مبروك! خلصت كل المراحل');}
  }
  const lv=pz>=378?4:pz>=238?3:pz>=118?2:1;
  if(lv>level&&!dead&&doneLevels<lv-1){doneLevels=lv-1;addCoins(100,'خلصت المرحلة '+doneLevels);}
  if(lv!==level&&!dead){if(lv>cpLevel){cpLevel=lv;cpZ=lv===4?380:lv===3?240:120;}if(lv===4)memT=0;level=lv;MON.x=0;MON.z=homeZ();MON.state='idle';MON.decoy=false;MON.vel=0;MON.moving=false;MON.face=Math.PI;MON.wait=0;document.getElementById('hint').textContent=hintFor(level);}
  updateMonster(t,dt);updateAudio(t,dt);updateRipples(t,dt);updateProj(t,dt);updateDucks(t,dt);updateBlasts(dt);
  if(dead){let dy=Math.atan2(MON.x-px,MON.z-pz)-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));yaw+=dy*Math.min(1,dt*10);pitch+=(0.9-pitch)*Math.min(1,dt*5);}
  camera.position.set(px,py,pz);
  camera.lookAt(px+Math.sin(yaw)*Math.cos(pitch),py+Math.sin(pitch),pz+Math.cos(yaw)*Math.cos(pitch));
  if(dead){
    scareT+=dt;
    mon.head.getWorldPosition(HP);
    const k=Math.min(1,scareT*9),dist=(4.2-k*2.4)-Math.min(scareT,2.5)*0.28;
    const fxd=Math.sin(MON.face),fzd=Math.cos(MON.face),sh=0.09*Math.max(0.25,1-scareT/2.2);
    camera.position.set(HP.x+fxd*dist+(Math.random()-0.5)*sh,HP.y+0.15+(Math.random()-0.5)*sh,HP.z+fzd*dist+(Math.random()-0.5)*sh);
    camera.lookAt(HP.x,HP.y+0.05,HP.z);
    camera.fov=90+Math.min(1,scareT*8)*28+Math.sin(scareT*30)*2;camera.updateProjectionMatrix();
    const j=Math.sin(scareT*45)*0.25;mon.armL.rotation.z=j;mon.armR.rotation.z=-j;mon.head.rotation.z=Math.sin(scareT*38)*0.08;
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<div id="login" style="position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(43,29,16,.9);font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:0 16px">
  <div style="font:800 34px system-ui,sans-serif">بركة ماي 🌊</div>
  <div style="font-size:18px;opacity:.85">اكتب اسمك وادخل تلعب مع أصحابك</div>
  <input id="nm" maxlength="14" placeholder="اسمك" style="width:min(280px,80vw);padding:14px;border-radius:14px;border:0;font:700 22px system-ui,sans-serif;text-align:center">
  <button id="go" style="width:min(280px,80vw);padding:16px 0;border:0;border-radius:16px;font:700 22px system-ui,sans-serif;background:#3fbf7a;color:#0b2a1a">ادخل</button>
  <div id="lerr" style="font-size:14px;color:#ffb4a8"></div>
</div>
<script>
(function(){
  const COLS=[0xe74c3c,0x3498db,0x2ecc71,0xf1c40f,0x9b59b6,0xe67e22,0x1abc9c,0xec407a];
  const myC=Math.floor(Math.random()*8);let ws=null,myId=0,myName='',ghosts=new Map(),lastSend=0;
  const nm=document.getElementById('nm'),go=document.getElementById('go'),login=document.getElementById('login'),lerr=document.getElementById('lerr');
  try{nm.value=localStorage.getItem('bm_name')||'';}catch(e){}
  const badge=document.createElement('div');
  badge.style.cssText='position:fixed;left:14px;top:calc(10px + env(safe-area-inset-top,0px));font:700 14px system-ui,sans-serif;color:#2b1d10;background:rgba(255,255,255,.5);padding:4px 12px;border-radius:12px;pointer-events:none;z-index:2';
  document.body.appendChild(badge);
  function tag(name){
    const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
    g.font='700 34px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=7;g.strokeStyle='rgba(0,0,0,.7)';g.strokeText(name,128,32);g.fillStyle='#fff';g.fillText(name,128,32);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,fog:false}));
    sp.scale.set(3.2,0.8,1);sp.position.y=3.2;return sp;
  }
  function mk(name,c){
    const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:COLS[c%8]});
    const b=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.6),m);b.position.y=1.1;
    const h=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7),new THREE.MeshLambertMaterial({color:0xffe0b8}));h.position.y=2.2;
    const f=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.2),m);f.position.set(0,2.2,0.4);
    g.add(b,h,f,tag(name));scene.add(g);return g;
  }
  function connect(){
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
    ws.onopen=()=>{ws.send(JSON.stringify({t:'join',name:myName,c:myC}));login.style.display='none';};
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      if(m.t==='hi'){myId=m.id;}
      else if(m.t==='p'){
        const seen=new Set();
        for(const [id,name,c,x,y,z,r,d] of m.list){
          if(id===myId)continue;seen.add(id);
          let g=ghosts.get(id);if(!g){g=mk(name,c);g.position.set(x,y,z);ghosts.set(id,g);}
          g.userData.t={x,y,z,r,d};
        }
        for(const [id,g] of ghosts)if(!seen.has(id)){scene.remove(g);ghosts.delete(id);}
        badge.textContent=ghosts.size?('👥 '+(ghosts.size+1)+' لاعبين'):'';
      }
    };
    ws.onclose=()=>{badge.textContent='';for(const [,g] of ghosts)scene.remove(g);ghosts.clear();setTimeout(connect,2000);};
    ws.onerror=()=>{lerr.textContent='ما قدرت أتصل بالسيرفر، جرّب كمان مرة';login.style.display='flex';};
  }
  go.onclick=()=>{
    myName=nm.value.trim();if(!myName){lerr.textContent='اكتب اسمك أول';return;}
    try{localStorage.setItem('bm_name',myName);}catch(e){}
    lerr.textContent='';connect();
  };
  function tick(now){
    if(ws&&ws.readyState===1&&now-lastSend>66){
      lastSend=now;
      if(started)ws.send(JSON.stringify({t:'s',x:px,y:fy,z:pz,r:yaw,d:dead?1:0}));
    }
    for(const [,g] of ghosts){
      const t=g.userData.t;if(!t)continue;
      g.position.x+=(t.x-g.position.x)*0.35;g.position.y+=(t.y-g.position.y)*0.35;g.position.z+=(t.z-g.position.z)*0.35;
      g.rotation.y=t.r;g.rotation.x=t.d?-1.4:0;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
